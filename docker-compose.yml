services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.api
    container_name: cyberscope-backend
    ports:
      - "8000:8000"  # Проброс порта на хост
    volumes:
      - ./backend:/app
      - ./backend/reports:/app/reports
    environment:
      - PYTHONUNBUFFERED=1
      - SQLALCHEMY_DATABASE_URL=sqlite:///./cyberscope.db
    command: uvicorn server:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - cyberscope-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  bot:
    build:
      context: ./backend
      dockerfile: Dockerfile.bot
    container_name: cyberscope-bot
    volumes:
      - ./backend:/app        
      - ./backend/reports:/app/reports
    environment:
      - PYTHONUNBUFFERED=1
      - BOT_TOKEN=${BOT_TOKEN}
      - API_BASE_URL=http://backend:8000/api  # Используем имя сервиса
    depends_on:
      - backend
    networks:
      - cyberscope-network
    restart: on-failure

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cyberscope-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/node_modules:/app/node_modules
    environment:
      - REACT_APP_API_URL=http://localhost:8000  # Для браузера это localhost хоста
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
    depends_on:
      - backend
    networks:
      - cyberscope-network

networks:
  cyberscope-network:
    driver: bridge